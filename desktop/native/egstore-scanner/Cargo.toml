[package]
name = "egdata-native-scanner"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", default-features = false, features = ["napi4"] }
napi-derive = "3.0.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
strip = "symbols"
