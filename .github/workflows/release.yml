name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.4.0 or 1.4.0-beta.1)"
        required: true
        type: string

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release version must be SemVer, for example 1.4.0 or 1.4.0-beta.1."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build-windows:
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Electron version
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: node scripts/set-version.mjs "$env:RELEASE_VERSION"

      - name: Run Electron release checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm test:e2e
          pnpm audit --prod
          pnpm build

      - name: Build unsigned NSIS installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter 'egdata-app-*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/dist/egdata-app-*-setup.exe
            desktop/dist/egdata-app-*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: release-metadata
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Electron version
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: node scripts/set-version.mjs "$RELEASE_VERSION"

      - name: Build unsigned universal macOS DMG
        run: |
          pnpm build
          pnpm exec electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create DMG checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/egdata-app-*-macos.dmg)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#packages[@]}." >&2
            exit 1
          fi
          package="${packages[0]}"
          shasum -a 256 "$package" | sed 's#  dist/#  #' > "$package.sha256"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            desktop/dist/egdata-app-*-macos.dmg
            desktop/dist/egdata-app-*-macos.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  build-android:
    needs: release-metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ needs.release-metadata.outputs.version }}"
          sed -i -E "s/^version: .*/version: $VERSION+$GITHUB_RUN_NUMBER/" pubspec.yaml

      - name: Update version in main.dart
        run: |
          VERSION="${{ needs.release-metadata.outputs.version }}"
          sed -i "s/const String appVersion = '[^']*';/const String appVersion = '$VERSION';/" lib/main.dart

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Wear OS app (if present)
        if: ${{ hashFiles('android/wear/**') != '' }}
        working-directory: android
        run: ./gradlew :wear:assembleRelease

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.release-metadata.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/egdata-app-$VERSION-android.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/egdata-app-$VERSION-android.aab

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/egdata-app-*-android.apk
          retention-days: 7

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/egdata-app-*-android.aab
          retention-days: 7

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Generate Isar bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build iOS (simulator)
        run: flutter build ios --simulator --no-codesign

  create-release:
    needs: [release-metadata, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-appbundle
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-metadata.outputs.version }}
          name: egdata.app v${{ needs.release-metadata.outputs.version }}
          draft: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Desktop package trust notice

            The Windows and macOS desktop packages are unsigned community builds. Operating-system reputation warnings are expected. Verify each desktop download against its accompanying SHA-256 checksum before running it.

            On macOS, use Finder's **Open** confirmation for the downloaded application if Gatekeeper identifies it as an unsigned application.
          files: |
            artifacts/egdata-app-*-setup.exe
            artifacts/egdata-app-*-setup.exe.sha256
            artifacts/egdata-app-*-macos.dmg
            artifacts/egdata-app-*-macos.dmg.sha256
            artifacts/egdata-app-*-android.apk
            artifacts/egdata-app-*-android.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
