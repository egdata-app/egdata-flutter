name: Publish Electron to Microsoft Store flight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Electron version to publish (e.g., 1.3.0)"
        required: true
        type: string
      flight_id:
        description: "Required private Microsoft Store flight ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Set Electron version
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$env:RELEASE_VERSION"

      - name: Build Electron app
        working-directory: desktop
        run: pnpm build

      - name: Create AppX package
        working-directory: desktop
        run: pnpm exec electron-builder --win appx --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate AppX package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\desktop\dist" -Filter '*.appx' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one AppX package, found $($packages.Count)."
          }
          $packagePath = $packages[0].FullName
          "STORE_PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store credentials
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MS_SELLER_ID: ${{ secrets.MS_SELLER_ID }}
        run: msstore reconfigure --tenantId "$env:AZURE_TENANT_ID" --clientId "$env:AZURE_CLIENT_ID" --clientSecret "$env:AZURE_CLIENT_SECRET" --sellerId "$env:MS_SELLER_ID"

      - name: Publish to private Store flight
        env:
          STORE_APP_ID: ${{ secrets.MS_APP_ID }}
          STORE_FLIGHT_ID: ${{ inputs.flight_id }}
        run: msstore publish "$env:GITHUB_WORKSPACE\desktop" -i "$env:STORE_PACKAGE_PATH" -id "$env:STORE_APP_ID" -f "$env:STORE_FLIGHT_ID"

      - name: Upload AppX artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-appx-package
          path: desktop/dist/*.appx
          retention-days: 30
