name: Desktop Electron

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-electron.yml"
      - ".github/workflows/publish-msstore.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-electron.yml"
      - ".github/workflows/publish-msstore.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      package_unsigned:
        description: Build unsigned development packages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm audit --prod

  unsigned-package:
    if: github.event_name == 'workflow_dispatch' && inputs.package_unsigned
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win nsis appx --x64 --publish never
            artifact: desktop/dist/*
            name: electron-windows-unsigned
          - os: macos-latest
            command: npx electron-builder --mac dmg zip --universal --publish never
            artifact: desktop/dist/*
            name: electron-macos-unsigned
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
